name: Build and Push Notification Server

on:
  workflow_dispatch:
    inputs:
      push_latest:
        description: 'Push latest tag'
        required: false
        default: true
        type: boolean

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Read version
        id: version
        working-directory: ./go/notification
        run: |
          version=$(cat version | tr -d '[:space:]')
          if ! echo "$version" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "Error: Invalid version format in version file"
            exit 1
          fi
          echo "version=${version}" >> $GITHUB_OUTPUT

      - name: Set up Go
        uses: actions/setup-go@v4
        with:
          go-version: '1.25'

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          platforms: linux/amd64,linux/arm64

      - name: Prepare image tags
        id: image_tags
        run: |
          image="${{ secrets.DOCKERHUB_USERNAME }}/clipshare-notify-server"
          {
            echo "tags<<EOF"
            echo "${image}:${{ steps.version.outputs.version }}"
            if [[ "${{ inputs.push_latest }}" == "true" ]]; then
              echo "${image}:latest"
            fi
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: ./go/notification
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.image_tags.outputs.tags }}
